<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f7f7f7;
    }

    .slideshow {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%;
      height: 100%;
    }

    .slide {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
    }

    @keyframes fadeShow {
      0%      { opacity: 0; }
      1.5009% { opacity: 1; }
      7.5047% { opacity: 1; }
      9.0066% { opacity: 0; }
      100%    { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="slideshow" id="slideshow">
    <div class="slide" data-src="https://cdn.jsdelivr.net/gh/laurenced101/Website-Images@main/Slideshow%20Images/ML.jpeg"></div>
    <div class="slide" data-src="https://cdn.jsdelivr.net/gh/laurenced101/Website-Images@main/Slideshow%20Images/LEGO%20House.jpeg"></div>
    <div class="slide" data-src="https://cdn.jsdelivr.net/gh/laurenced101/Website-Images@main/Slideshow%20Images/Assist.jpeg"></div>
    <div class="slide" data-src="https://cdn.jsdelivr.net/gh/laurenced101/Website-Images@main/Slideshow%20Images/Watch.jpeg"></div>
    <div class="slide" data-src="https://cdn.jsdelivr.net/gh/laurenced101/Website-Images@main/Slideshow%20Images/LEGO%20Fox.jpeg"></div>
    <div class="slide" data-src="https://cdn.jsdelivr.net/gh/laurenced101/Website-Images@main/Slideshow%20Images/Duran%20Duran.jpeg"></div>
    <div class="slide" data-src="https://cdn.jsdelivr.net/gh/laurenced101/Website-Images@main/Slideshow%20Images/Desk.jpeg"></div>
    <div class="slide" data-src="https://cdn.jsdelivr.net/gh/laurenced101/Website-Images@main/Slideshow%20Images/LEGO%20Movie.jpeg"></div>
    <div class="slide" data-src="https://cdn.jsdelivr.net/gh/laurenced101/Website-Images@main/Slideshow%20Images/Brainwash.jpeg"></div>
    <div class="slide" data-src="https://cdn.jsdelivr.net/gh/laurenced101/Website-Images@main/Slideshow%20Images/Cooking.jpeg"></div>
    <div class="slide" data-src="https://cdn.jsdelivr.net/gh/laurenced101/Website-Images@main/Slideshow%20Images/Augmoto.jpeg"></div>
    <div class="slide" data-src="https://cdn.jsdelivr.net/gh/laurenced101/Website-Images@main/Slideshow%20Images/LEGO%20Creator.jpeg"></div>
    <div class="slide" data-src="https://cdn.jsdelivr.net/gh/laurenced101/Website-Images@main/Slideshow%20Images/LEGO%20Minifigs.jpeg"></div>
  </div>

  <script>
    const CYCLE_MS    = 26650;
    const STAGGER_MS  = 2050;
    const START_DELAY = 1500;

    const slides = Array.from(document.querySelectorAll('.slide'));

    slides.forEach(slide => {
      slide.style.backgroundImage = `url("${slide.dataset.src}")`;
    });

    function startSlideshow() {
      slides.forEach((slide, i) => {
        slide.style.animation = 'none';
        void slide.offsetWidth;
        slide.style.animation = `fadeShow ${CYCLE_MS}ms linear ${i * STAGGER_MS}ms infinite both`;
      });
    }

    let loaded = 0;
    slides.forEach(slide => {
      const img = new Image();
      img.onload = img.onerror = () => {
        loaded++;
        if (loaded === slides.length) setTimeout(startSlideshow, START_DELAY);
      };
      img.src = slide.dataset.src;
    });
  </script>
</body>
</html>
